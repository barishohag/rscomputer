      </nav></div>
      <div class="side-bottom"><div class="nav-label">Manage</div><nav class="nav"><button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.4.8l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.4-.8l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.7l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.4-.8l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.4.8l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.6Z" transform="translate(-1 -1)"/></svg>Settings</button><a class="nav-link" href="/admin/access"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 8v6m3-3h-6"/></svg>Account approvals</a></nav>
        <div class="shop-card"><div class="shop-kicker">Your data</div><div class="shop-title">Cloud backup</div><span class="local-pill sync-pending" id="cloudStatus" aria-live="polite"><i></i>Connecting…</span></div>
      </div>
    </aside>
    <main>
      <header class="topbar"><div class="crumb"><button class="btn small mobile-menu" id="menuBtn" aria-label="Open menu">☰</button> <span class="hide-mobile">RS Computer&nbsp; / &nbsp;</span><b id="crumbPage">Overview</b></div><div class="top-actions"><button class="btn small hide-mobile" id="exportBtn">Export data</button><button class="btn small theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">☾ Dark</button><span class="admin-pill"><i></i>Admin</span><a class="btn small" href="/api/logout" target="_top">Sign out</a><div class="avatar" id="avatar">RS</div></div></header>
      <section class="content" id="page"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const KEY='rscomputer-pos-v1';
    const THEME_KEY='rscomputer-theme-v1';
    function applyTheme(theme){document.documentElement.dataset.theme=theme;const button=document.getElementById('themeToggle');if(button){const dark=theme==='dark';button.textContent=dark?'☀ Light':'☾ Dark';button.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');button.setAttribute('title',dark?'Switch to light mode':'Switch to dark mode');button.setAttribute('aria-pressed',String(dark))}}
    const seed={settings:{shopName:'RS Computer',staff:[],methods:['Cash','bKash / Mobile Banking','Card','Due / Credit']},sales:[],collections:[],orders:[],cashCounts:{}};
    let db=load();let pageName='overview';let selectedDate=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||today();let searchText='';
    function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}
    let cloudWritePending=false;let cloudWriteActive=false;
    function setCloudStatus(label,state=''){const el=document.getElementById('cloudStatus');if(!el)return;el.lastChild.textContent=label;el.classList.toggle('sync-error',state==='error');el.classList.toggle('sync-pending',state==='pending')}
    function validCloudData(data){return data&&typeof data==='object'&&!Array.isArray(data)&&data.settings&&typeof data.settings==='object'&&!Array.isArray(data.settings)&&Array.isArray(data.sales)&&Array.isArray(data.collections)&&Array.isArray(data.orders)&&data.cashCounts&&typeof data.cashCounts==='object'&&!Array.isArray(data.cashCounts)}
    async function putCloudSnapshot(snapshot){const response=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:snapshot}),keepalive:true});if(!response.ok)throw new Error('Cloud backup request failed')}
    async function flushCloudWrites(){if(cloudWriteActive)return;cloudWriteActive=true;try{while(cloudWritePending){cloudWritePending=false;await putCloudSnapshot(db)}setCloudStatus('Cloud backup saved')}catch{cloudWritePending=true;setCloudStatus('Cloud save failed — change again to retry','error')}finally{cloudWriteActive=false}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}cloudWritePending=true;setCloudStatus('Saving to cloud…','pending');void flushCloudWrites()}
    function mergeRecords(localRows,cloudRows,keyName){const records=new Map();for(const row of [...(Array.isArray(localRows)?localRows:[]),...(Array.isArray(cloudRows)?cloudRows:[])]){const key=row&&typeof row==='object'?(row[keyName]||row.id||JSON.stringify(row)):JSON.stringify(row);records.set(String(key),row)}return [...records.values()]}
    function mergeLocalAndCloud(localData,cloudData){const settings={...localData.settings,...cloudData.settings};for(const [key,value] of Object.entries(localData.settings||{})){if(JSON.stringify(value)!==JSON.stringify(seed.settings[key])&&JSON.stringify(cloudData.settings?.[key])===JSON.stringify(seed.settings[key]))settings[key]=value}return {...localData,...cloudData,settings,sales:mergeRecords(localData.sales,cloudData.sales,'memo'),collections:mergeRecords(localData.collections,cloudData.collections,'id'),orders:mergeRecords(localData.orders,cloudData.orders,'id'),cashCounts:{...localData.cashCounts,...cloudData.cashCounts}}}
    async function initializeCloudData(){const localData=structuredClone(db);setCloudStatus('Loading backup…','pending');try{const response=await fetch('/api/data',{cache:'no-store'});if(!response.ok)throw new Error('Cloud backup is unavailable');const result=await response.json();if(result.data){if(!validCloudData(result.data))throw new Error('Cloud backup format is invalid');db=mergeLocalAndCloud(localData,result.data);localStorage.setItem(KEY,JSON.stringify(db));if(JSON.stringify(db)!==JSON.stringify(result.data))await putCloudSnapshot(db);selectedDate=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||today();setCloudStatus('Cloud backup ready')}else{db=localData;await putCloudSnapshot(localData);setCloudStatus('Cloud backup ready')}}catch{db=localData;setCloudStatus('Local only — cloud backup unavailable','error')}document.getElementById('avatar').textContent=initials(db.settings.shopName);render()}
    window.addEventListener('online',()=>{if(cloudWritePending)void flushCloudWrites()});
    function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function today(){return localISO(new Date())}
    function money(n){return '৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:0})}
    function dateLabel(s,opts={day:'numeric',month:'short',year:'numeric'}){if(!s)return '—';return new Date(s+'T00:00:00').toLocaleDateString('en-GB',opts)}
    function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function total(s){return Number(s.qty)*Number(s.price)}
    function remaining(s){return Math.max(0,total(s)-Number(s.paid||0)-db.collections.filter(c=>c.memo===s.memo).reduce((a,c)=>a+Number(c.amount),0))}
    function cashFor(day){return db.sales.filter(s=>s.date===day&&s.method==='Cash').reduce((a,s)=>a+Number(s.paid||0),0)+db.collections.filter(c=>c.date===day&&c.method==='Cash').reduce((a,c)=>a+Number(c.amount),0)}
    function digitalFor(day){return db.sales.filter(s=>s.date===day&&s.method!=='Cash').reduce((a,s)=>a+Number(s.paid||0),0)+db.collections.filter(c=>c.date===day&&c.method!=='Cash').reduce((a,c)=>a+Number(c.amount),0)}
    function dayGross(day){return db.sales.filter(s=>s.date===day).reduce((a,s)=>a+total(s),0)}
    function dayPaid(day){return db.sales.filter(s=>s.date===day).reduce((a,s)=>a+Number(s.paid||0),0)+db.collections.filter(c=>c.date===day).reduce((a,c)=>a+Number(c.amount),0)}
    function openDues(){return db.sales.filter(remaining).sort((a,b)=>b.date.localeCompare(a.date))}
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
    const names={overview:'Overview',sales:'Sales',dues:'Due management',cash:'Cash close',orders:'Pending orders',settings:'Settings'};
    document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
    document.querySelector('[data-page="settings"]').addEventListener('click',()=>go('settings'));
    document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('exportBtn').onclick=exportData;
    function go(p){pageName=p;searchText='';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumbPage').textContent=names[p];document.getElementById('sidebar').classList.remove('open');render()}
    function pageHeader(eyebrow,title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div><div class="head-actions">${actions}</div></div>`}
    function kpi(label,value,note,icon){return `<div class="card kpi"><div class="kpi-top"><span>${label}</span><span class="kpi-icon">${icon}</span></div><div class="kpi-value">${value}</div><div class="kpi-note">${note}</div></div>`}
    const icons={sales:'<svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM8 3v4m8-4v4M4 10h16"/></svg>',cash:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>',due:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10m3-7c-.7-.7-1.6-1-3-1-1.5 0-2.5.6-2.5 1.7s.8 1.5 2.5 1.8 2.5.8 2.5 1.8-1 1.7-2.6 1.7c-1.2 0-2.2-.4-3-1"/></svg>',memo:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6m-6 4h6m-6 4h4"/></svg>'};
    function render(){document.getElementById('page').innerHTML=({overview:overview,sales:salesPage,dues:duesPage,cash:cashPage,orders:ordersPage,settings:settingsPage}[pageName])();bindPage()}
    function overview(){const totalAll=db.sales.reduce((a,s)=>a+total(s),0),dueAll=openDues().reduce((a,s)=>a+remaining(s),0),daySales=dayGross(selectedDate),paid=dayPaid(selectedDate),cash=cashFor(selectedDate),digital=digitalFor(selectedDate);let days=[];for(let i=6;i>=0;i--){const d=new Date(selectedDate+'T00:00:00');d.setDate(d.getDate()-i);days.push(localISO(d))}let max=Math.max(1,...days.map(dayGross));let bars=days.map(d=>`<div class="bar-col"><span class="bar-value">${dayGross(d)?money(dayGross(d)):' '}</span><div class="bar-track"><div class="bar ${d===selectedDate?'today':''}" style="height:${Math.max(3,dayGross(d)/max*100)}%"></div></div><span class="bar-label">${dateLabel(d,{day:'numeric',month:'short'})}</span></div>`).join('');let recent=[...db.sales].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,5);return `${pageHeader('Shop overview','Good day, ' + esc(db.settings.shopName),'A clear view of sales, collections and what needs attention.',`<div class="date-control"><button id="prevDay" aria-label="Previous day">‹</button><strong>${dateLabel(selectedDate)}</strong><button id="nextDay" aria-label="Next day">›</button></div><button class="btn primary" id="newSale">＋ New sale</button>`)}
      <div class="grid kpis">${kpi('Sales on selected day',money(daySales),`${db.sales.filter(s=>s.date===selectedDate).length} sale memos`,icons.sales)}${kpi('Payments collected',money(paid),'Sales payments + due collections',icons.cash)}${kpi('Outstanding dues',money(dueAll),`${openDues().length} customer${openDues().length===1?'':'s'} to follow up`,icons.due)}${kpi('All-time sales',money(totalAll),`${db.sales.length} recorded memos`,icons.memo)}</div>
      <div class="grid main-grid"><section class="card panel"><div class="panel-head"><div><div class="panel-title">Sales trend</div><div class="panel-sub">Daily gross sales · 7 days through ${dateLabel(selectedDate)}</div></div><div class="legend"><i></i>Gross sales</div></div><div class="chart">${bars}</div></section><section class="card panel"><div class="panel-head"><div><div class="panel-title">Collection mix</div><div class="panel-sub">Payments received on ${dateLabel(selectedDate)}</div></div><span class="badge green">${money(paid)} total</span></div><div class="channel-list"><div class="channel-row"><span>Cash</span><strong>${money(cash)}</strong><div class="channel-track"><div class="channel-fill" style="width:${paid?cash/paid*100:0}%"></div></div></div><div class="channel-row"><span>Digital & other</span><strong>${money(digital)}</strong><div class="channel-track"><div class="channel-fill" style="width:${paid?digital/paid*100:0}%"></div></div></div></div><div class="channel-foot"><span>Reconciliation</span><strong>${db.cashCounts[selectedDate]!=null?(Number(db.cashCounts[selectedDate])===cash?'Balanced':`Variance ${money(Number(db.cashCounts[selectedDate])-cash)}`):'Count pending'}</strong></div></section></div>
      <div class="grid bottom-grid"><section class="card panel"><div class="panel-head"><div><div class="panel-title">Recent sales</div><div class="panel-sub">Latest memos from your register</div></div><button class="btn small" data-go="sales">All sales&nbsp; →</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Memo / Customer</th><th>Staff</th><th>Payment</th><th class="amount">Total</th></tr></thead><tbody>${recent.map(s=>`<tr class="memo-row" role="button" tabindex="0" data-open-memo="${esc(s.memo)}" title="Open and print ${esc(s.memo)}"><td><div class="table-primary">${esc(s.memo)} · ${esc(s.customer)}</div><div class="table-secondary">${dateLabel(s.date)} · ${esc(s.item)}</div></td><td>${esc(s.staff)}</td><td><span class="badge ${s.method==='Cash'?'green':''}">${esc(s.method)}</span></td><td class="amount">${money(total(s))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sales yet. Record your first sale to get started.</div>'}</section><section class="card panel"><div class="panel-head"><div><div class="panel-title">Due follow-up</div><div class="panel-sub">Balances waiting to be collected</div></div><button class="btn small" data-go="dues">View dues&nbsp; →</button></div><div class="list-stack">${openDues().slice(0,4).map(s=>`<div class="due-row"><div class="person"><div class="person-avatar">${esc(initials(s.customer))}</div><div><div class="person-name">${esc(s.customer)}</div><div class="person-meta">${esc(s.memo)} · ${dateLabel(s.date,{day:'numeric',month:'short'})}</div></div></div><strong>${money(remaining(s))}</strong></div>`).join('')||'<div class="empty">All customer balances are clear.</div>'}</div></section></div>`}
    function initials(s){return String(s||'RS').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
    function salesPage(){const q=searchText.toLowerCase(),rows=[...db.sales].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).filter(s=>[s.memo,s.customer,s.item,s.staff,s.method].join(' ').toLowerCase().includes(q));return `${pageHeader('Register','Sales','Review every memo and payment recorded at the counter.',`<button class="btn primary" id="newSale">＋ New sale</button>`)}<section class="card panel"><div class="toolbar"><div class="search"><input id="search" placeholder="Search customer, memo, item…" value="${esc(searchText)}"></div><span class="badge">${rows.length} memos</span></div><div class="table-wrap"><table><thead><tr><th>Memo / Date</th><th>Customer</th><th>Item</th><th>Staff</th><th>Payment</th><th class="amount">Total</th><th class="amount">Paid</th><th class="amount">Due</th></tr></thead><tbody>${rows.map(s=>`<tr class="memo-row" role="button" tabindex="0" data-open-memo="${esc(s.memo)}" title="Open and print ${esc(s.memo)}"><td><div class="table-primary">${esc(s.memo)}</div><div class="table-secondary">${dateLabel(s.date)} · ${esc(s.time||'')}</div></td><td>${esc(s.customer)}</td><td><div class="table-primary">${esc(s.item)}</div><div class="table-secondary">${s.qty} × ${money(s.price)}</div></td><td>${esc(s.staff)}</td><td><span class="badge ${s.method==='Cash'?'green':''}">${esc(s.method)}</span></td><td class="amount">${money(total(s))}</td><td class="amount">${money(s.paid)}</td><td class="amount">${remaining(s)?`<span class="badge amber">${money(remaining(s))}</span>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No matching sales found.</td></tr>'}</tbody></table></div></section>`}
    function duesPage(){const rows=openDues();return `${pageHeader('Receivables','Due management','Keep customer balances visible and record each collection.',`<button class="btn" id="exportBtn2">Export data</button>`)}<div class="grid recon-grid"><div class="card recon-stat"><label>Outstanding balance</label><strong>${money(rows.reduce((a,s)=>a+remaining(s),0))}</strong><small>Across ${rows.length} open memo${rows.length===1?'':'s'}</small></div><div class="card recon-stat"><label>Collected later</label><strong>${money(db.collections.reduce((a,c)=>a+Number(c.amount),0))}</strong><small>${db.collections.length} collection${db.collections.length===1?'':'s'} recorded</small></div><div class="card recon-stat"><label>Cleared memos</label><strong>${db.sales.filter(s=>remaining(s)===0).length}</strong><small>Fully paid at sale or settled later</small></div></div><section class="card panel"><div class="panel-head"><div><div class="panel-title">Open customer balances</div><div class="panel-sub">Collect a partial amount or clear the full balance</div></div></div><div class="table-wrap"><table><thead><tr><th>Customer / Memo</th><th>Contact</th><th>Sale date</th><th class="amount">Memo total</th><th class="amount">Remaining</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><div class="table-primary">${esc(s.customer)}</div><div class="table-secondary">${esc(s.memo)} · ${esc(s.item)}</div></td><td>${esc(s.phone||'—')}</td><td>${dateLabel(s.date)}</td><td class="amount">${money(total(s))}</td><td class="amount"><span class="badge amber">${money(remaining(s))}</span></td><td><button class="btn small collect" data-memo="${esc(s.memo)}">Collect payment</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No outstanding customer balances.</td></tr>'}</tbody></table></div></section><section class="card panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Recent collections</div><div class="panel-sub">Payments collected after the original sale</div></div></div>${db.collections.length?`<div class="table-wrap"><table><thead><tr><th>Customer / Memo</th><th>Date</th><th>Method</th><th class="amount">Collected</th></tr></thead><tbody>${[...db.collections].reverse().map(c=>`<tr><td><div class="table-primary">${esc(c.customer)}</div><div class="table-secondary">${esc(c.memo)}</div></td><td>${dateLabel(c.date)}</td><td>${esc(c.method)}</td><td class="amount">${money(c.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Later collections will appear here.</div>'}</section>`}
    function cashPage(){const day=selectedDate,cash=cashFor(day),digital=digitalFor(day),count=db.cashCounts[day],delta=count==null?null:Number(count)-cash;const daySales=db.sales.filter(s=>s.date===day);return `${pageHeader('End of day','Cash close','Compare recorded cash with the amount counted at the counter.',`<div class="date-control"><button id="prevDay">‹</button><strong>${dateLabel(day)}</strong><button id="nextDay">›</button></div>`)}<div class="grid recon-grid"><div class="card recon-stat"><label>Expected cash</label><strong>${money(cash)}</strong><small>Cash sales plus cash due collections</small></div><div class="card recon-stat"><label>Digital & other</label><strong>${money(digital)}</strong><small>Non-cash payments recorded for this day</small></div><div class="card recon-stat"><label>Total collected</label><strong>${money(cash+digital)}</strong><small>Cash + digital receipts</small></div></div><section class="card panel"><div class="panel-head"><div><div class="panel-title">Daily reconciliation</div><div class="panel-sub">Enter the counted cash to calculate the difference.</div></div><span class="badge ${delta==null?'':delta===0?'green':'amber'}">${delta==null?'Pending count':delta===0?'Balanced':delta>0?'Surplus':'Shortage'}</span></div><div style="display:flex;align-items:end;gap:12px;flex-wrap:wrap"><div class="field" style="margin:0"><label for="cashCount">Actual counted cash (৳)</label><input class="recon-input" id="cashCount" type="number" min="0" step="1" placeholder="Enter count" value="${count==null?'':count}"></div><button class="btn primary" id="saveCount">Save count</button>${delta==null?'':`<span style="font-size:12px;color:var(--muted);padding-bottom:9px">Difference: <strong style="color:${delta===0?'var(--green)':delta>0?'var(--amber)':'var(--red)'}">${delta>0?'+':''}${money(delta)}</strong></span>`}</div></section><section class="card panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Receipts for ${dateLabel(day)}</div><div class="panel-sub">Sales recorded on this date</div></div><span class="badge">${daySales.length} sales</span></div><div class="table-wrap"><table><thead><tr><th>Memo / Customer</th><th>Payment method</th><th class="amount">Memo total</th><th class="amount">Collected</th></tr></thead><tbody>${daySales.map(s=>`<tr><td><div class="table-primary">${esc(s.memo)} · ${esc(s.customer)}</div><div class="table-secondary">${esc(s.item)}</div></td><td>${esc(s.method)}</td><td class="amount">${money(total(s))}</td><td class="amount">${money(s.paid)}</td></tr>`).join('')}${db.collections.filter(c=>c.date===day).map(c=>`<tr><td><div class="table-primary">Due collection · ${esc(c.customer)}</div><div class="table-secondary">${esc(c.memo)}</div></td><td>${esc(c.method)}</td><td class="amount">—</td><td class="amount">${money(c.amount)}</td></tr>`).join('')||''}${!daySales.length&&!db.collections.some(c=>c.date===day)?'<tr><td colspan="4" class="empty">No receipts for this date.</td></tr>':''}</tbody></table></div></section>`}
    function ordersPage(){return `${pageHeader('Order desk','Pending orders','Track customer requests that still need to be prepared or handed over.',`<button class="btn primary" id="newOrder">＋ Add order</button>`)}<div class="grid kpis">${kpi('Open orders',db.orders.filter(o=>o.status!=='Ready').length,'Waiting to be prepared',icons.memo)}${kpi('Ready for pickup',db.orders.filter(o=>o.status==='Ready').length,'Ready to hand over',icons.sales)}${kpi('Order value',money(db.orders.reduce((a,o)=>a+Number(o.amount||0),0)),'Across current orders',icons.cash)}${kpi('Overdue',db.orders.filter(o=>o.dueDate&&o.dueDate<today()&&o.status!=='Ready').length,'Past expected date',icons.due)}</div><section class="card panel"><div class="panel-head"><div><div class="panel-title">Order queue</div><div class="panel-sub">Update the order status as work moves forward</div></div></div>${db.orders.length?`<div class="table-wrap"><table><thead><tr><th>Customer</th><th>Item / details</th><th>Due date</th><th>Status</th><th class="amount">Amount</th><th></th></tr></thead><tbody>${db.orders.map(o=>`<tr><td><div class="table-primary">${esc(o.customer)}</div><div class="table-secondary">${esc(o.phone||'No contact')}</div></td><td>${esc(o.item)}</td><td>${dateLabel(o.dueDate)}</td><td><select class="select order-status" data-id="${esc(o.id)}"><option ${o.status==='Waiting'?'selected':''}>Waiting</option><option ${o.status==='In progress'?'selected':''}>In progress</option><option ${o.status==='Ready'?'selected':''}>Ready</option></select></td><td class="amount">${money(o.amount)}</td><td><button class="btn small danger delete-order" data-id="${esc(o.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:48px 14px"><div style="font-size:20px;margin-bottom:8px;color:var(--ink)">No orders in the queue</div>Add a customer request and keep its due date and status here.</div>'}</section>`}
    function settingsPage(){return `${pageHeader('Configuration','Shop settings','Manage the shop name, team and accepted payment methods. Changes save in this browser.',`<button class="btn" id="resetData">Restore sample data</button>`)}<div class="grid settings-grid"><section class="card panel"><div class="panel-head"><div><div class="panel-title">Shop profile</div><div class="panel-sub">Details shown across your workspace</div></div></div><form id="settingsForm"><div class="field"><label for="shopName">Shop name</label><input id="shopName" required value="${esc(db.settings.shopName)}"></div><div class="field"><label for="staffList">Team members</label><textarea id="staffList" placeholder="One name per line">${esc(db.settings.staff.join('\n'))}</textarea></div><div class="field"><label for="methodList">Payment methods</label><textarea id="methodList" placeholder="One method per line">${esc(db.settings.methods.join('\n'))}</textarea></div><button class="btn primary" type="submit">Save settings</button></form></section><section class="card panel"><div class="panel-head"><div><div class="panel-title">Your sample data</div><div class="panel-sub">Imported from the workbook</div></div><span class="badge green">Starter records</span></div><div class="list-stack"><div class="due-row"><span>Sales memos</span><strong>${db.sales.length}</strong></div><div class="due-row"><span>Open customer dues</span><strong>${openDues().length}</strong></div><div class="due-row"><span>Due collections</span><strong>${db.collections.length}</strong></div><div class="due-row"><span>Pending orders</span><strong>${db.orders.length}</strong></div></div><p class="notice" style="margin-top:14px">Your updates are stored in this browser using local storage. Use Export data to keep a backup or move the records to another device.</p><button class="btn" id="exportBtn2">Download backup</button></section><section class="card panel"><div class="panel-head"><div><div class="panel-title">Administrator sign-in</div><span class="badge green">Owner access only</span></div></div><p class="notice">This workspace is protected by the Site's owner-only ChatGPT sign-in. Only the authorized owner account can open the dashboard. Use the sign-out control in the top bar to end this session.</p><a class="btn" href="/api/logout" target="_top">Sign out of admin account</a></section></div>`}
    function bindPage(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('#newSale').forEach(b=>b.onclick=showSaleModal);document.querySelectorAll('#prevDay').forEach(b=>b.onclick=()=>shiftDay(-1));document.querySelectorAll('#nextDay').forEach(b=>b.onclick=()=>shiftDay(1));const search=document.getElementById('search');if(search)search.oninput=e=>{searchText=e.target.value;render();document.getElementById('search')?.focus();document.getElementById('search')?.setSelectionRange(searchText.length,searchText.length)};document.querySelectorAll('[data-open-memo]').forEach(row=>{const open=()=>showMemo(row.dataset.openMemo);row.onclick=open;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});document.querySelectorAll('.collect').forEach(b=>b.onclick=()=>showCollectModal(b.dataset.memo));const saveCount=document.getElementById('saveCount');if(saveCount)saveCount.onclick=()=>{const n=document.getElementById('cashCount').value;if(n===''){toast('Enter the counted cash first.');return}db.cashCounts[selectedDate]=Number(n);save();render();toast('Cash count saved.')};const submitSettings=document.getElementById('settingsForm');if(submitSettings)submitSettings.onsubmit=e=>{e.preventDefault();db.settings.shopName=document.getElementById('shopName').value.trim()||'RS Computer';db.settings.staff=document.getElementById('staffList').value.split('\n').map(x=>x.trim()).filter(Boolean);db.settings.methods=document.getElementById('methodList').value.split('\n').map(x=>x.trim()).filter(Boolean);save();document.getElementById('avatar').textContent=initials(db.settings.shopName);render();toast('Shop settings saved.')};const reset=document.getElementById('resetData');if(reset)reset.onclick=()=>{if(confirm('Restore the workbook sample data? This replaces records saved in this browser.')){db=structuredClone(seed);selectedDate='2026-10-07';save();render();toast('Sample data restored.')}};const ex=document.getElementById('exportBtn2');if(ex)ex.onclick=exportData;document.getElementById('newOrder')?.addEventListener('click',showOrderModal);document.querySelectorAll('.order-status').forEach(s=>s.onchange=()=>{const o=db.orders.find(x=>x.id===s.dataset.id);if(o){o.status=s.value;save();render();toast('Order status updated.')}});document.querySelectorAll('.delete-order').forEach(b=>b.onclick=()=>{db.orders=db.orders.filter(o=>o.id!==b.dataset.id);save();render();toast('Order removed.')})}
    function shiftDay(n){const d=new Date(selectedDate+'T00:00:00');d.setDate(d.getDate()+n);selectedDate=localISO(d);render()}
    function openModal(title,sub,body,onSubmit){const wrap=document.getElementById('modalBackdrop'),modal=document.getElementById('modal');modal.innerHTML=`<div class="modal-head"><div><h2>${title}</h2><p>${sub}</p></div><button class="close" id="closeModal">×</button></div>${body}`;wrap.classList.add('open');document.getElementById('closeModal').onclick=()=>wrap.classList.remove('open');wrap.onclick=e=>{if(e.target===wrap)wrap.classList.remove('open')};const form=modal.querySelector('form');if(form)form.onsubmit=e=>{e.preventDefault();if(onSubmit(new FormData(form))!==false)wrap.classList.remove('open')}}
    function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
    function selectField(label,name,options,selected){return `<div class="field"><label>${label}</label><select class="select" name="${name}">${options.map(o=>`<option ${o===selected?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
    function nextMemo(){const nums=db.sales.map(s=>Number((s.memo||'').split('-').pop())).filter(Number.isFinite);return 'MEMO-'+String(Math.max(1000,...nums)+1)}
    function showSaleModal(){const methods=db.settings.methods,staff=db.settings.staff;openModal('Record a sale','Add the memo details and payment received.',`<form><div class="form-grid">${field('Customer name','customer','text','','required')}${selectField('Staff member','staff',staff,staff[0]||'Other')}${field('Item description','item','text','','required')}${field('Quantity','qty','number','1','required min="0.01" step="0.01"')}${field('Unit price (৳)','price','number','','required min="0" step="1"')}${selectField('Payment method','method',methods,methods[0]||'Cash')}${field('Amount paid (৳)','paid','number','','required min="0" step="1"')}${field('Date','date','date',today(),'required')}${field('Contact number','phone') }<div class="field span-2"><label>Notes</label><input name="notes" placeholder="Optional details"></div></div><p class="notice">The remaining amount is added to customer dues automatically.</p><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save sale</button></div></form>`,f=>{const s={memo:nextMemo(),date:f.get('date'),time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),customer:f.get('customer').trim(),staff:f.get('staff'),item:f.get('item').trim(),qty:Number(f.get('qty')),price:Number(f.get('price')),method:f.get('method'),paid:Number(f.get('paid')),phone:f.get('phone').trim(),notes:f.get('notes').trim()};if(s.paid>s.qty*s.price){toast('Amount paid cannot be greater than the memo total.');return false}db.sales.push(s);selectedDate=s.date;save();go('sales');toast('Sale saved as '+s.memo)});document.getElementById('cancelModal').onclick=()=>document.getElementById('modalBackdrop').classList.remove('open')}
    function showMemo(memo){const s=db.sales.find(x=>x.memo===memo);if(!s)return;const totalAmount=total(s),due=remaining(s),collections=db.collections.filter(c=>c.memo===s.memo),laterPaid=collections.reduce((sum,c)=>sum+Number(c.amount||0),0);const history=collections.map(c=>`<div class="memo-line"><span>${dateLabel(c.date)} · ${esc(c.method||'Payment')}</span><strong>${money(c.amount)}</strong></div>`).join('');const receipt=`<article id="memoPrint" class="memo-receipt"><header class="memo-brand"><div><div class="memo-shop">${esc(db.settings.shopName||'RS Computer')}</div><div class="memo-caption">Computer sales and service</div></div><div class="memo-label">CASH MEMO</div></header><div class="memo-number"><strong>${esc(s.memo)}</strong><span>${dateLabel(s.date)}${s.time?' · '+esc(s.time):''}</span></div><div class="memo-customer"><div><small>Customer</small><strong>${esc(s.customer||'Walk-in customer')}</strong></div><div><small>Served by</small><strong>${esc(s.staff||'—')}</strong></div>${s.phone?`<div><small>Phone</small><strong>${esc(s.phone)}</strong></div>`:''}</div><table class="memo-items"><thead><tr><th>Item description</th><th>Qty</th><th>Unit price</th><th class="amount">Amount</th></tr></thead><tbody><tr><td>${esc(s.item)}</td><td>${esc(s.qty)}</td><td>${money(s.price)}</td><td class="amount">${money(totalAmount)}</td></tr></tbody></table><div class="memo-totals"><div><span>Total</span><strong>${money(totalAmount)}</strong></div><div><span>Paid at sale · ${esc(s.method||'Payment')}</span><strong>${money(s.paid)}</strong></div>${laterPaid?`<div><span>Paid later</span><strong>${money(laterPaid)}</strong></div>`:''}<div class="memo-balance"><span>Balance due</span><strong>${money(due)}</strong></div></div>${history?`<section class="memo-history"><small>Later payments</small>${history}</section>`:''}${s.notes?`<p class="memo-notes"><strong>Notes:</strong> ${esc(s.notes)}</p>`:''}<footer class="memo-footer"><span>Thank you for your business.</span><span>Authorized signature</span></footer></article>`;openModal('Cash memo',`${esc(s.memo)} · ${esc(s.customer||'Walk-in customer')}`,`${receipt}<div class="modal-actions memo-screen-actions"><button type="button" class="btn" id="closeMemo">Close</button><button type="button" class="btn primary" id="printMemo">Print memo</button></div>`);document.getElementById('closeMemo').onclick=()=>document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('printMemo').onclick=()=>window.print()}
    function showCollectModal(memo){const s=db.sales.find(x=>x.memo===memo);if(!s)return;const due=remaining(s);openModal('Collect a payment',`${esc(s.customer)} · ${esc(s.memo)} · balance ${money(due)}`,`<form><div class="form-grid">${field('Amount received (৳)','amount','number',due,`required min="1" max="${due}" step="1"`)}${selectField('Payment method','method',db.settings.methods.filter(x=>x!=='Due / Credit'),db.settings.methods[0]||'Cash')}${field('Collection date','date','date',today(),'required')}</div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save collection</button></div></form>`,f=>{const amount=Number(f.get('amount'));if(amount<=0||amount>remaining(s)){toast('Enter an amount up to the current balance.');return false}db.collections.push({id:crypto.randomUUID(),memo:s.memo,customer:s.customer,date:f.get('date'),amount,method:f.get('method')});save();render();toast('Payment recorded.')});document.getElementById('cancelModal').onclick=()=>document.getElementById('modalBackdrop').classList.remove('open')}
    function showOrderModal(){openModal('Add a pending order','Keep a customer request on the order queue.',`<form><div class="form-grid">${field('Customer name','customer','text','','required')}${field('Contact number','phone')}${field('Item / request','item','text','','required')}${field('Expected date','dueDate','date',today())}${field('Order amount (৳)','amount','number','','min="0" step="1"')}</div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Add order</button></div></form>`,f=>{db.orders.push({id:crypto.randomUUID(),customer:f.get('customer').trim(),phone:f.get('phone').trim(),item:f.get('item').trim(),dueDate:f.get('dueDate'),amount:Number(f.get('amount')||0),status:'Waiting'});save();render();toast('Order added to the queue.')});document.getElementById('cancelModal').onclick=()=>document.getElementById('modalBackdrop').classList.remove('open')}
    function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`rscomputer-backup-${today()}.json`;a.click();URL.revokeObjectURL(url);toast('Backup downloaded.')}
    const themeToggle=document.getElementById('themeToggle');themeToggle?.addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(THEME_KEY,theme)}catch{}applyTheme(theme)});applyTheme(document.documentElement.dataset.theme||'light');
    document.getElementById('modalBackdrop').addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalBackdrop').classList.remove('open')});initializeCloudData();
  </script>
